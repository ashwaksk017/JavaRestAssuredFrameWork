# Default (fallback) configuration
# Per-environment overrides in application-{env}.properties
# Env variable / -Dkey overrides win over both.

# Active environment. Picks which block of program_configuration.json to
# use (e.g. `stg`, `qa`, `prod`). Override via -Denv=... or TEST_ENV env var.
env=stg

# Base URL fallback. Only used when program_configuration.json is absent
# OR its active env has no api_config.api_end_point set. When the JSON is
# present, Config.baseUrl() derives from `api_config.api_end_point` +
# `api_config.version` and this value is ignored.
baseUrl=https://jsonplaceholder.typicode.com

# HTTP timeouts (milliseconds)
connectTimeoutMs=10000
socketTimeoutMs=30000

# Auth (leave empty when unused)
auth.type=none
# auth.type = none | bearer | basic | oauth2
auth.bearer.token=
auth.basic.username=
auth.basic.password=
auth.oauth2.tokenUrl=
auth.oauth2.clientId=
auth.oauth2.clientSecret=
auth.oauth2.scope=

# Retry
retry.maxCount=2

# Re-fetch the Hilton OAuth token once when a business call returns
# 401/403 with token-expired / invalid-token (body or WWW-Authenticate).
# Skipped for tokenRequest itself, Salesforce steps, and expected 401s.
# Disable with -Dauth.tokenRefresh.enabled=false
auth.tokenRefresh.enabled=true

# Reporting
report.allure.enabled=true
report.extent.enabled=true

# Tricentis DemoWebshop -- public demo target used by the sample login test.
# baseUrl below is only overridden for the demoshop test; the framework's
# default `baseUrl` (jsonplaceholder) stays in place for the other tests.
demoshop.baseUrl=https://demowebshop.tricentis.com
demoshop.loginPath=/login
# Credentials -- NEVER commit real values here. Provide via -D or env var:
#   -Ddemoshop.username=... -Ddemoshop.password=...
#   DEMOSHOP_USERNAME=... DEMOSHOP_PASSWORD=...
demoshop.username=
demoshop.password=

# Database (Db utility) -- leave blank to skip DB-dependent tests.
# Example Postgres:
#   db.url=jdbc:postgresql://localhost:5432/mydb
#   db.user=myuser
#   db.password=mypass
# Override via -Ddb.url=... / DB_URL env var; NEVER commit real creds.
db.url=
db.user=
db.password=
db.driver=org.postgresql.Driver
# sql = plain JDBC (default). jooq = org.jooq over the same SQL strings +
# Db.withDsl() for fluent checks. Override: -Ddb.api=jooq
db.api=sql

# Jira Xray (Cloud) -- results sync at end of suite.
# xray.enabled is the master kill switch; leave FALSE for local / public-repo
# runs so the suite never phones home unintentionally. Turn on with
# -Dxray.enabled=true + credentials.
xray.enabled=false
xray.baseUrl=https://xray.cloud.getxray.app
xray.clientId=
xray.clientSecret=
# Optional -- omit to have Xray create a fresh execution per run.
xray.testExecutionKey=

# GitLab CI/CD + test management (issues / Quality test cases).
# JUnit reports are uploaded by .gitlab-ci.yml (MR Test summary) with no
# extra flags. API sync (MR discussion + issue notes) is off by default.
# Enable in GitLab CI/CD variables: GITLAB_ENABLED=true and GITLAB_TOKEN
# (PAT with api scope). Project id comes from CI_PROJECT_ID.
# CSV column gitlab_test_case_id or @GitLabTest("42") maps a method to an
# issue / test-case IID. Override: -Dgitlab.enabled=true
gitlab.enabled=false
gitlab.baseUrl=
gitlab.token=
gitlab.projectId=
gitlab.mergeRequestNote=true
gitlab.issueNotes=true
gitlab.summaryDir=target

# Bounded re-read when a step's asserted JsonPath value has not propagated
# yet. 0 = OFF (default): a step reads once, exactly as ReadyAPI did.
# Set a budget in ms (e.g. 10000) to turn a propagation-lag failure into a
# pass. Cost: a genuinely-wrong value takes this long to report.
# NOTE: this does NOT shorten ReadyAPI Delay steps -- those keep their full
# wall-clock wait, because the racy step is not reliably the next one.
rest.pollExpectedJsonMs=0

# ReadyAPI Delay steps register a deferred budget instead of sleeping; any
# later step that fails its expected status may spend it. true = ON (default).
# Set false to restore a real sleep at every delay.
rest.deferDelays=true
# Most a single step may claim from the pooled budget.
rest.asyncBudgetCapMs=60000
# Re-check interval while spending budget.
rest.asyncBudgetIntervalMs=2000
