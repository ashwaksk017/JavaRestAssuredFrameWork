  /guests/{guestId}/businesses/verify:
    parameters:
    - name: guestId
      in: path
      required: true
      description: Internal id assigned to a new Guest Profile.
      format: int64
      type: integer
    get:
      x-api-include:
        hospitality-customer:
          x-auth-type: Application User
          x-route-in-sequence: guestIdInClaimMustMatchGuestIdInPath
        hospitality-corporate:
          x-auth-type: Application User
          x-route-in-sequence: paramRolesRoleOnly
      x-portal-domain: Customer
      x-portal-capability: Program Accounts
      operationId: VerifyProgramAccount
      tags:
      - Program Account
      summary: Verify Program Account
      description: "Search existing active program accounts based on attributes that\
        \ match the search parameters. A list of  matched companies will be returned\
        \ along with confidence for each based on count of attributes matched. \n\n\
        \ If checkForDuplicates query param is false then will only verify query params\
        \ are valid and will  not check for duplicate companies. \n\nIf checkForDuplicates\
        \ query param is true or not explicitly passed then following query params\
        \ must be included: \n  * **name**\n  * **addressLine1**\n  * **city**  *\
        \ \n  * **country**\n  * **website**\n  * **emailDomain**\n  * **phoneNumber/phoneCountry**\
        \  \n"
      produces:
      - application/json
      parameters:
      - name: checkForDuplicates
        in: query
        required: false
        description: Enables matching against existing Program Accounts. If false then only query params are validated. Default is true.
        type: boolean
      - name: name
        in: query
        required: false
        type: string
        description: Program Account Name
        pattern: ^(?!\p{Zs})((?![\|\=\;\}\{])[\p{L}\p{N}\p{M}\p{P}\p{S}\p{Zs}]){1,60}(?<!\p{Zs})$
      - name: website
        in: query
        required: false
        description: Website
        maxLength: 2083
        type: string
        pattern: ^((?![\|\=\;])[\p{L}\p{N}\p{M}\p{P}\p{S}\p{Zs}])*$
      - name: addressLine1
        in: query
        required: false
        type: string
        pattern: ^(?!\p{Zs})((?![\|\=\;\}\{])[\p{L}\p{N}\p{M}\p{P}\p{S}\p{Zs}]){1,35}(?<!\p{Zs})$
        description: Address Line
      - name: addressLine2
        in: query
        required: false
        type: string
        pattern: ^(?!\p{Zs})((?![\|\=\;\}\{])[\p{L}\p{N}\p{M}\p{P}\p{S}\p{Zs}]){1,35}(?<!\p{Zs})$
        description: Address Line
      - name: addressLine3
        in: query
        required: false
        type: string
        pattern: ^(?!\p{Zs})((?![\|\=\;\}\{])[\p{L}\p{N}\p{M}\p{P}\p{S}\p{Zs}]){1,35}(?<!\p{Zs})$
        description: Address Line
      - name: city
        in: query
        required: false
        description: City name.
        type: string
        pattern: ^(?!\p{Zs})((?![\|\=\;\}\{])[\p{L}\p{N}\p{M}\p{P}\p{Zs}]){1,30}(?<!\p{Zs})$
      - name: state
        in: query
        required: false
        description: State name
        type: string
        pattern: ^[A-Za-z .,-_()]{1,60}$
      - name: country
        in: query
        required: false
        description: Country name
        minLength: 1
        maxLength: 60
        type: string
        pattern: ^((?![\|\=\;])[\p{L}\p{N}\p{M}\p{P}\p{S}\p{Zs}])*$
      - name: postalCode
        in: query
        required: false
        description: Postal code
        type: string
        pattern: ^(?!\p{Zs})[\p{L}\p{N}\p{Zs}-]{2,10}(?<!\p{Zs})$
      - name: emailDomain
        in: query
        required: false
        description: Business email domain
        type: string
        pattern: ^(?!-)([A-Za-z0-9-]{1,63}(?<!-)\.[a-zA-Z0-9-][a-zA-Z0-9-\.]*[a-zA-Z])
      - name: phoneCountry
        in: query
        required: false
        description: Phone Country
        type: string
        pattern: ^\d{1,3}$
      - name: phoneNumber
        in: query
        required: false
        description: Phone Number
        type: string
        pattern: ^[0-9]{7,15}$
      - name: travelAgentId
        in: query
        required: false
        description: Travel agency ID
        type: string
        pattern: ^[A-Z0-9]{1,22}$
      - name: ownerEmailAddress
        in: query
        required: false
        description: The owner's company email address
        type: string
      responses:
        200:
          description: Success
          schema:
            type: array
            items:
              $ref: '#/definitions/ProgramAccountVerifyResponse'
        400:
          $ref: '#/responses/400-BadRequest'
