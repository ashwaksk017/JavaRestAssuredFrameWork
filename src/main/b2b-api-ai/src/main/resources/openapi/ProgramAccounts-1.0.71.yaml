      summary: Compare Program Accounts
      description: "Compare company name data against Program Accounts to find accounts\
        \ that best match the request based on fuzzy match logic.\n If accountId query\
        \ parameter is provided then comparison will be completed only against the\
        \ single Program Account.\n\n If both company name and doingBusinessAsName\
        \ are sent as query parameters then both will be used to search  for possible\
        \ matches\n\n \n\nIf there are multiple accounts that equally have best match\
        \ then multiple accounts will be returned. \n\n"
      produces:
      - application/json
      parameters:
      - name: name
        in: query
        required: false
        type: string
        description: Program Account Name
        pattern: ^(?!\p{Zs})((?![\|\=\;\}\{])[\p{L}\p{N}\p{M}\p{P}\p{S}\p{Zs}]){1,60}(?<!\p{Zs})$
      - name: doingBusinessAsName
        in: query
        required: false
        type: string
        description: A ficticious name that the company operations under, aka trade name. Doing Business As often abbreviated as DBA
        pattern: ^(?!\p{Zs})((?![\|\=\;\}\{])[\p{L}\p{N}\p{M}\p{P}\p{S}\p{Zs}]){1,60}(?<!\p{Zs})$
