  /guests/{guestId}/businesses/{accountId}/spendDetail:
    parameters:
    - name: guestId
      in: path
      required: true
      description: Internal id assigned to a new Guest Profile.
      format: int64
      type: integer
    - name: accountId
      in: path
      required: true
      description: Internal id assigned to a Program Account
      format: int64
      type: integer
    get:
      x-api-include:
        hospitality-customer:
          x-auth-type: Application User
          x-route-in-sequence: guestIdInClaimMustMatchGuestIdInPath
        hospitality-corporate:
          x-auth-type: Application User
          x-route-in-sequence: paramRolesRoleOnly
      x-portal-domain: Customer
      x-portal-capability: Program Accounts
      operationId: ReadProgramAccountSpendDetail
      tags:
      - Account Dashboard
      summary: Read Program Account Spend Detail
      description: |
        Read the program account spend detail over a given period.
        ** Date Searches: **
          * The default date filter is current spend if not provided.
          * When using timeframe as a filter, the current system time will be used as the startDate if not provided.
          * When using endDate as a filter, startDate is required.
          * When timeframe is in (past, current, or future), endDate is not allowed.
          * When timeframe is in (arrivals, departures), startDate is required and endDate is optional (defaults to equal startDate).
      parameters:
      - name: spendType
        in: query
        required: false
        description: If included, limit response to transactions of this type
        type: string
        enum:
        - room
        - group
        - event
        x-model-name: SpendDetailType
      - in: query
        name: spendStatus
        description: Spend Status. Possible values are confirmed, cancelled, checkinRequested, inHouse, checkout.  Default is all values if a filter is not provided.
        required: false
        type: array
        items:
          type: string
        collectionFormat: csv
        uniqueItems: true
      - in: query
        name: startDate
        required: false
        type: string
        format: date
        description: The start date as defined by full-date - RFC3339 (YYYY-MM-DD).
      - in: query
        name: endDate
        required: false
        type: string
        format: date
        description: The end date as defined by full-date - RFC3339 (YYYY-MM-DD).
      - in: query
        name: timeframe
        required: false
        type: string
        enum:
        - past
        - current
        - future
        - arrivals
        - departures
        description: |-
          Valid values are past, current, future, arrivals, departures.
          (past) = All stays where departureDate < startDate
          (current) = All stays that encompass the startDate
          (future) = All current and future stays
          (arrivals) = All stays with an arrivalDate between startDate and endDate
          (departures) = All stays with a departureDate between startDate and endDate
        x-model-name: Timeframe
      - in: query
        name: sortOrder
        type: string
        description: Arrival date sort order.  Default order is descending for a past spend request (endDate < today or timeframe=past).  All other requests are ascending.
        enum:
        - asc
        - desc
        x-model-name: SortOrderShort
      - in: query
        name: pointsEligible
