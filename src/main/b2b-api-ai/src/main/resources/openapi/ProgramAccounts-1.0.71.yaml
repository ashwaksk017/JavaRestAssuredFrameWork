definitions:
  ProgramMemberRole:
    description: Permission role of Program Account Member
    type: string
    enum:
    - owner
    - admin
    - travelCoordinator
    - travelAdvisor
    - employee
    x-model-name: ProgramMemberRole
    x-external-lib: Enumerations
  ProgramAccountMemberNameLocale:
    type: object
    properties:
      locale:
        type: string
        description: 5 character code in the format of xx-XX ISO 639-1 Language Code and ISO 3166-1 Country Code
        pattern: ^[a-z]{2}-[A-Z]{2}$
      transliterated:
        type: boolean
        description: Was this transliterated.
      firstName:
        description: Guest first name.
        type: string
        pattern: ^(?!\p{Zs})((?![\|\=\;\}\{])[\p{L}\p{N}\p{M}\p{P}\p{Zs}]){1,30}(?<!\p{Zs})$
      lastName:
        description: Guest last name
        type: string
        pattern: ^(?!\p{Zs})((?![\|\=\;\}\{])[\p{L}\p{N}\p{M}\p{P}\p{Zs}]){1,30}(?<!\p{Zs})$
      middleInit:
        type: string
        description: Middle Initial
        pattern: ^[\p{L}\p{M}]{1}$
      title:
        type: string
        description: Additional name text providing position, professional qualification, generational suffix, honorific, or veneration
        pattern: ^((?![\|\=\;])[\p{L}\p{N}\p{M}\p{P}\p{Zs}]){1,48}$
    x-external-lib: BusinessToBusinessModels
  PartnerGuestName:
    required:
    - firstName
    - lastName
    type: object
    properties:
      firstName:
        description: Guest first name.
        type: string
        pattern: ^(?!\p{Zs})((?![\|\=\;\}\{])[\p{L}\p{N}\p{M}\p{P}\p{Zs}]){1,30}(?<!\p{Zs})$
      lastName:
        description: Guest last name
        type: string
        pattern: ^(?!\p{Zs})((?![\|\=\;\}\{])[\p{L}\p{N}\p{M}\p{P}\p{Zs}]){1,30}(?<!\p{Zs})$
      middleInit:
        type: string
        description: Middle Initial
        pattern: ^[\p{L}\p{M}]{1}$
      title:
        type: string
        description: Additional name text providing position, professional qualification, generational suffix, honorific, or veneration
        pattern: ^((?![\|\=\;])[\p{L}\p{N}\p{M}\p{P}\p{Zs}]){1,48}$
      nameLocalizations:
        type: array
        items:
          $ref: '#/definitions/ProgramAccountMemberNameLocale'
    x-external-lib: BusinessToBusinessModels
  ProgramMemberStatus:
