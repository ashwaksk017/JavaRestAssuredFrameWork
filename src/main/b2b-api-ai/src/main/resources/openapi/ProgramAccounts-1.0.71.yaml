      - name: corporateIdHCRS
        in: query
        required: false
        type: string
        pattern: ^[A-Z0-9]{1,22}$
        description: Corporate account Id
      - name: corporateIdPCRS
        in: query
        required: false
        type: string
        pattern: ^[A-Z0-9]{1,22}$
        description: Corporate account Id
      - name: travelAgentId
        in: query
        required: false
        type: string
        pattern: ^[A-Z0-9]{1,22}$
        description: Travel Agent Client Id
      - name: dunsNumber
        in: query
        required: false
        description: Dun & Bradstreet number of the business
        type: integer
      - name: salesforceId
        in: query
        required: false
        description: Salesforce Account Id
        type: string
        pattern: '[A-Za-z0-9]{15,18}$'
      - name: salesforceLeadId
        in: query
        required: false
        description: Salesforce Lead Id
        type: string
        pattern: '[A-Za-z0-9]{15,18}$'
      - name: salesforceProgramParticipationId
        in: query
        required: false
        description: Salesforce Program Participation Id
        type: string
        pattern: '[A-Za-z0-9]{15,18}$'
      - name: nationalTaxId
        in: query
        required: false
        description: National tax Id
        type: string
        pattern: ^\d{1,22}$
      - name: name
        in: query
        required: false
        type: string
        description: Program Account Name
        pattern: ^(?!\p{Zs})((?![\|\=\;\}\{])[\p{L}\p{N}\p{M}\p{P}\p{S}\p{Zs}]){1,60}(?<!\p{Zs})$
      - name: partialSearch
        in: query
        required: false
        description: Indicates that a partial search should be performed.  Defaults to false. If true then search results will contain Program Account names which contain the partial text provided in name parameter. At least 3 chars required in name for partialSearch to be used.
        type: boolean
      - name: offset
        in: query
        type: integer
        description: Offset the list of returned results by this amount. Default offset is zero.
      - name: limit
        in: query
        type: integer
        description: Number of items to retrieve. Default limit is 100.
      responses:
        200:
          description: Success
          schema:
            type: array
            items:
              $ref: '#/definitions/ProgramAccountSummary'
        206:
          description: Partial Content
          headers:
            Content-Range:
              type: string
              description: Range of the list being returned based on the offset and limit.
          schema:
            type: array
            items:
              $ref: '#/definitions/ProgramAccountSummary'
        400:
