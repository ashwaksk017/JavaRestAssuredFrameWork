  /guests/{guestId}/businesses/{accountId}/members/{memberId}/stays:
    parameters:
    - name: guestId
      in: path
      required: true
      description: Internal id assigned to a new Guest Profile.
      format: int64
      type: integer
    - name: accountId
      in: path
      required: true
      description: Internal id assigned to a Program Account
      format: int64
      type: integer
    - name: memberId
      in: path
      required: true
      description: Internal id assigned to a member within a Program Account
      format: int64
      type: integer
    get:
      x-api-include:
        hospitality-customer:
          x-auth-type: Application User
          x-route-in-sequence: guestIdInClaimMustMatchGuestIdInPath
        hospitality-corporate:
          x-auth-type: Application User
          x-route-in-sequence: paramRolesRoleOnly
      x-portal-domain: Customer
      x-portal-capability: Program Accounts
      operationId: ReadStayFromConfirmationNumber
      tags:
      - Account Dashboard
      summary: Retrieve account stay
      description: "Retrieves account stay based on confirmation number with option\
        \ to also pass GNR number. \nRequires account member to have view access based\
        \ on program account permissions for the original booker of the stay.\nSearches\
        \ for stay within all timeframes (past, current, or future).\n"
      parameters:
      - in: query
        name: confNumber
        required: true
        type: string
        description: Confirmation Number
      - in: query
        name: gnrNumber
        required: false
        type: integer
        format: int64
        description: GNR Number
      - in: query
        name: startDate
        required: false
        type: string
        format: date
        description: The start date as defined by full-date - RFC3339 (YYYY-MM-DD).
      - in: query
        name: endDate
        required: false
        type: string
        format: date
        description: The end date as defined by full-date - RFC3339 (YYYY-MM-DD).
      - in: query
        name: timeframe
        required: false
        type: string
        enum:
        - past
        - current
        - future
        - arrivals
        - departures
        description: |-
          Valid values are past, current, future, arrivals, departures.
          (past) = All stays where departureDate < startDate
          (current) = All stays that encompass the startDate
          (future) = All current and future stays
          (arrivals) = All stays with an arrivalDate between startDate and endDate
          (departures) = All stays with a departureDate between startDate and endDate
        x-model-name: Timeframe
      - in: query
        name: includeCostDetails
        required: false
        description: Include rate and point cost details in the response.
        type: boolean
      responses:
        200:
          description: Success
          schema:
            $ref: '#/definitions/jsonObject'
          headers:
            Hilton-Is-Editable:
              description: Indicates if member has access to modify/cancel the stay.
              type: boolean
            Hilton-Is-Cancelable:
              description: Indicates if member has access to cancel the stay.
              type: boolean
        400:
          $ref: '#/responses/400-BadRequest'
        403:
          $ref: '#/responses/403-Forbidden'
        404:
          $ref: '#/responses/404-NotFound'
