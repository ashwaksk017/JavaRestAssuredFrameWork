# Allure runtime configuration
# Results directory can be overridden by -Dallure.results.directory
allure.results.directory=target/allure-results
allure.link.issue.pattern=https://your-tracker.example/issue/{}
allure.link.tms.pattern=https://your-tms.example/case/{}
# Soft-assert flush lives in @AfterMethod. Never list that hook as its
# own test; failures are stamped onto the real @Test (BaseApiTest.assertAll).
allure.testng.hide.configuration.failures=true
