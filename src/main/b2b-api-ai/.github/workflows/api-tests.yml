name: API Automation Tests

on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]
    workflow_dispatch:

permissions:
    contents: read
    actions: read

jobs:
    api-tests:
        name: Rest Assured + TestNG (Java 17)
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Set up JDK 17
              uses: actions/setup-java@v4
              with:
                  distribution: zulu
                  java-version: 17
                  cache: maven

            - name: Restore Allure history cache
              uses: actions/cache/restore@v4
              with:
                  path: allure-history
                  key: allure-history-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
                  restore-keys: |
                      allure-history-${{ github.ref_name }}-
                      allure-history-${{ github.event.repository.default_branch }}-

            - name: Download last Allure history artifact
              if: hashFiles('allure-history/**') == ''
              continue-on-error: true
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  RUN_ID=$(gh run list --workflow api-tests.yml --branch "${{ github.event.repository.default_branch }}" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
                  if [ -z "$RUN_ID" ]; then
                    echo "No previous successful run to copy Allure history from"
                    exit 0
                  fi
                  mkdir -p allure-history
                  gh run download "$RUN_ID" -n allure-history -D allure-history

            - name: Run tests
              run: mvn -B -e test
              env:
                  TEST_ENV: qa

            - name: Generate Allure report
              if: always()
              run: |
                  python3 tools/allure_history.py restore
                  mvn -B allure:report
                  python3 tools/allure_history.py save

            - name: Save Allure history cache
              if: always() && hashFiles('allure-history/**') != ''
              continue-on-error: true
              uses: actions/cache/save@v4
              with:
                  path: allure-history
                  key: allure-history-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

            - name: Upload Allure history
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: allure-history
                  path: allure-history/
                  if-no-files-found: ignore
                  retention-days: 30

            - name: Upload Allure results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: allure-results
                  path: target/allure-results/

            - name: Upload Allure report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: allure-report
                  path: target/allure-report/

            - name: Upload Extent report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: extent-report
                  path: extent-reports/

            - name: Upload TestNG surefire reports
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: surefire-reports
                  path: target/surefire-reports/

            - name: Upload log files
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: log-files
                  path: logs/
