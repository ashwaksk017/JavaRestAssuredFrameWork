name: API Automation Tests

on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]
    workflow_dispatch:

jobs:
    api-tests:
        name: Rest Assured + TestNG (Java 17)
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Set up JDK 17
              uses: actions/setup-java@v4
              with:
                  distribution: zulu
                  java-version: 17
                  cache: maven

            - name: Run tests
              run: mvn -B -e test
              env:
                  TEST_ENV: qa

            - name: Generate Allure report
              if: always()
              run: mvn -B allure:report

            - name: Upload Allure results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: allure-results
                  path: target/allure-results/

            - name: Upload Allure report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: allure-report
                  path: target/allure-report/

            - name: Upload Extent report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: extent-report
                  path: extent-reports/

            - name: Upload TestNG surefire reports
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: surefire-reports
                  path: target/surefire-reports/

            - name: Upload log files
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: log-files
                  path: logs/
